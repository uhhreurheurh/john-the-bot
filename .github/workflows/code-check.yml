name: Bot code checks

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q .

      - name: Import and command-tree smoke test
        env:
          BOT_TOKEN: smoke-test-token
        run: |
          python - <<'PY'
          import asyncio
          from types import SimpleNamespace

          import discord
          from discord import app_commands

          # bot.py calls bot.run() at the end; replace it for the smoke test.
          discord.Client.run = lambda self, token: None

          import bot
          import custom_role
          from hoodify_feature import hoodify_text
          import uwuify

          required = {
              'uwuify', 'unuwuify', 'uwucount',
              'hoodify', 'unhoodify', 'hoodcount', 'custom',
          }
          registered = {command.name for command in bot.tree.get_commands()}
          missing = required - registered
          assert not missing, f'Missing root commands: {sorted(missing)}'

          custom_group = bot.tree.get_command('custom')
          assert isinstance(custom_group, app_commands.Group), 'Missing /custom group'
          custom_role_group = custom_group.get_command('role')
          assert isinstance(custom_role_group, app_commands.Group), 'Missing /custom role group'
          custom_subcommands = {command.name for command in custom_role_group.commands}
          expected_custom_subcommands = {'create', 'color', 'random', 'rename', 'icon', 'remove', 'share', 'unshare'}
          assert expected_custom_subcommands <= custom_subcommands, (
              f'Missing custom role subcommands: {sorted(expected_custom_subcommands - custom_subcommands)}'
          )

          # Verify the new share resolver accepts both exact usernames and numeric IDs.
          share_target = SimpleNamespace(
              id=123456789012345678,
              name='share-target',
              display_name='Share Target',
              global_name=None,
              guild=SimpleNamespace(id=bot.MAIN_SERVER),
              bot=False,
              roles=[],
          )
          fake_guild = SimpleNamespace(
              members=[share_target],
              get_member=lambda user_id: share_target if user_id == share_target.id else None,
          )
          resolved_username = asyncio.run(
              custom_role._resolve_guild_member(fake_guild, 'share-target')
          )
          resolved_user_id = asyncio.run(
              custom_role._resolve_guild_member(fake_guild, str(share_target.id))
          )
          assert resolved_username is share_target, 'Custom-role share username lookup failed'
          assert resolved_user_id is share_target, 'Custom-role share ID lookup failed'

          sample = uwuify.uwu('hello how are you?', flags=bot.UWU_FLAGS)
          assert isinstance(sample, str) and sample, 'UWUIFY produced no text'

          hood_sample = hoodify_text('not gonna lie, I have to go home')
          assert isinstance(hood_sample, str) and hood_sample, 'HOODIFY produced no text'

          print('Registered root commands:', sorted(registered))
          print('UWUIFY smoke output:', sample)
          print('HOODIFY smoke output:', hood_sample)
          PY